name: manager

on:
  push:
    branches: [ lite ]
    paths:
      - 'manager/**'
      - '.github/workflows/manager.yml'
  pull_request:
    paths:
      - 'manager/**'
      - '.github/workflows/manager.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: manager

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  build-guest:
    name: Build wrapper-manager guest initramfs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static cpio gzip e2fsprogs

      - name: Fetch the build-lite kernel and its modules
        run: |
          # The kernel (vmlinuz-lite-qemu) is produced by the build-lite
          # workflow. The e1000 and qemu_fw_cfg modules come from the same
          # artifact's initramfs, so they are built for that kernel.
          curl -fsSL -o qemu-assets.zip \
            "https://nightly.link/AMDL-Web/wrapper/workflows/build-lite/lite/qemu-assets.zip"
          unzip -o -q qemu-assets.zip vmlinuz-lite-qemu lite-initramfs.cpio.gz -d kernel-assets/

      - name: Build guest assets
        env:
          KERNEL_ASSETS: kernel-assets
        run: |
          chmod +x guest/build.sh guest/init
          ./guest/build.sh dist-guest
          CREATE_DATA_IMG=1 ./guest/build.sh dist-guest

      - name: Upload guest assets
        uses: actions/upload-artifact@v4
        with:
          name: manager-qemu-guest
          path: manager/dist-guest/
          # amdl pins one run of this artifact for its desktop guest.
          retention-days: 90

  build-launcher:
    name: Build wrapper-manager-qemu (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            goos: linux
            goarch: amd64
            ext: ""
          - name: linux-aarch64
            goos: linux
            goarch: arm64
            ext: ""
          - name: windows-x86_64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - name: macos-aarch64
            goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build launcher
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -o wrapper-manager-qemu${{ matrix.ext }} ./cmd/wrapper-manager-qemu

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-manager-qemu-${{ matrix.name }}
          path: manager/wrapper-manager-qemu${{ matrix.ext }}
          retention-days: 14
