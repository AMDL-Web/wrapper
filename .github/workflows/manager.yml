name: manager

on:
  push:
    branches: [ amdl ]
    paths:
      - 'manager/**'
      - '.github/workflows/manager.yml'
  pull_request:
    paths:
      - 'manager/**'
      - '.github/workflows/manager.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: manager

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Test
        run: go test -count=1 -race ./...

  build-guest:
    name: Build and boot the wrapper-manager guest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq busybox-static cpio gzip e2fsprogs file

      - name: Fetch the build-lite kernel and its modules
        run: |
          # The kernel and the e1000 and qemu_fw_cfg modules built for it come
          # from build-lite's qemu-assets artifact on amdl.
          curl -fsSL --retry 3 -o qemu-assets.zip \
            "https://nightly.link/AMDL-Web/wrapper/workflows/build-lite/amdl/qemu-assets.zip"
          unzip -o -q qemu-assets.zip vmlinuz-lite-qemu lite-initramfs.cpio.gz -d kernel-assets/

      - name: Build guest assets
        env:
          KERNEL_ASSETS: kernel-assets
        run: |
          ./guest/build.sh dist-guest
          CREATE_DATA_IMG=1 ./guest/build.sh dist-guest

      # Boots the guest just built in QEMU the way amdl's desktop app does,
      # with amdl's own code (internal/wrapperhost, TestGuestBoot): the manager
      # arguments must reach init, the guest must have network, download its
      # pinned payload with the digest checked, and the manager must answer
      # /status, again after a kill and after a stop. A guest that does not is
      # never uploaded for amdl to pin.
      - name: Boot the guest
        uses: AMDL-Web/apple-music-downloader/.github/actions/guestboot@dev
        with:
          checkout: dev
          guest-dir: ${{ github.workspace }}/manager/dist-guest

      - name: Blank and unmountable data disks
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/wrapper-manager-qemu" ./cmd/wrapper-manager-qemu
          LAUNCHER="$RUNNER_TEMP/wrapper-manager-qemu" timeout 1200 ./guest/disktest.sh dist-guest

      - name: Upload guest assets
        uses: actions/upload-artifact@v7
        with:
          name: manager-qemu-guest
          path: manager/dist-guest/
          # amdl pins one run of this artifact for its desktop guest.
          retention-days: 90

      - name: Build the QEMU image
        run: docker build -f Dockerfile.qemu -t wrapper-manager-qemu:ci .

  docker:
    name: Build the Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build and run -prepare
        run: |
          docker build -t wrapper-manager:ci .
          docker run --rm wrapper-manager:ci -prepare

  build-launcher:
    name: Build wrapper-manager-qemu (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            goos: linux
            goarch: amd64
            ext: ""
          - name: linux-aarch64
            goos: linux
            goarch: arm64
            ext: ""
          - name: windows-x86_64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - name: macos-aarch64
            goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Build launcher
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -o wrapper-manager-qemu${{ matrix.ext }} ./cmd/wrapper-manager-qemu

      - name: Upload launcher
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-manager-qemu-${{ matrix.name }}
          path: manager/wrapper-manager-qemu${{ matrix.ext }}
          retention-days: 14
