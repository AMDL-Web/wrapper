<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>wrapper-manager</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="panel/panel.css" />
    <script src="panel/panel.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <span class="tile" aria-hidden="true">
          <svg viewBox="0 0 20 20"><rect x="3" y="3.5" width="14" height="5.5" rx="1.5" /><rect x="3" y="11" width="14" height="5.5" rx="1.5" /><circle cx="6.2" cy="6.25" r=".9" class="fill" /><circle cx="6.2" cy="13.75" r=".9" class="fill" /></svg>
        </span>
        <div class="top-text">
          <h1>wrapper-manager</h1>
          <p class="sub" id="summary">&nbsp;</p>
        </div>
        <span class="chip" id="state" hidden></span>
      </header>

      <section id="key-section" aria-labelledby="key-title" hidden>
        <h2 id="key-title">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="12.5" r="3.5" /><path d="M9.5 10 16 3.5M13.5 6l2 2" /></svg>
          <span data-t="Wrapper key">Wrapper key</span>
        </h2>
        <form class="card form" id="key-form">
          <label class="field">
            <span>API_KEY</span>
            <input id="key" name="key" type="password" autocomplete="off" spellcheck="false" required data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" />
          </label>
          <div class="actions">
            <p class="error" id="key-error" role="alert" hidden></p>
            <button type="submit" class="primary" id="key-submit" data-t="Continue">Continue</button>
          </div>
        </form>
      </section>

      <div id="managed" hidden>
      <section aria-labelledby="accounts-title">
        <h2 id="accounts-title">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3.2" /><path d="M4 16.5c.9-2.8 3.2-4.3 6-4.3s5.1 1.5 6 4.3" /></svg>
          <span data-t="Accounts">Accounts</span>
        </h2>
        <div class="card" id="accounts">
          <div class="empty" id="empty" hidden data-t="No accounts">No accounts</div>
        </div>
        <p class="note" id="limit" hidden data-t="At most 10 accounts.">At most 10 accounts.</p>
      </section>

      <section aria-labelledby="login-title">
        <h2 id="login-title">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v13M3.5 10h13" /></svg>
          <span data-t="Add account">Add account</span>
        </h2>
        <form class="card form" id="login" autocomplete="off">
          <div class="credentials" id="credentials">
            <label class="field">
              <span data-t="Apple ID">Apple ID</span>
              <input id="user" name="username" type="email" autocomplete="off" required spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" />
            </label>
            <label class="field">
              <span data-t="Password">Password</span>
              <input id="pass" name="password" type="password" autocomplete="off" required data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" />
            </label>
          </div>
          <div class="code" id="code-row" hidden>
            <label class="field narrow">
              <span data-t="Verification code">Verification code</span>
              <input id="code" name="code" inputmode="numeric" autocomplete="off" maxlength="6" pattern="\d{6}" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" />
            </label>
          </div>
          <div class="actions">
            <p class="error" id="error" role="alert" hidden></p>
            <button type="button" class="ghost" id="back" hidden></button>
            <button type="submit" class="primary" id="submit" data-t="Log in">Log in</button>
          </div>
        </form>
        <p class="note bad" id="exposed" hidden data-t="No API_KEY: anyone who can reach this address can use these accounts.">No API_KEY: anyone who can reach this address can use these accounts.</p>
      </section>
      <section aria-labelledby="shown-title" id="shown-section" hidden>
        <h2 id="shown-title">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="12.5" r="3.5" /><path d="M9.5 10 16 3.5M13.5 6l2 2" /></svg>
          <span data-t="Wrapper key">Wrapper key</span>
        </h2>
        <div class="card form">
          <div class="shown">
            <input id="shown" type="password" readonly autocomplete="off" spellcheck="false" aria-labelledby="shown-title" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" />
            <button type="button" class="ghost small" id="reveal" data-t="Show">Show</button>
            <button type="button" class="ghost small" id="copy" data-t="Copy">Copy</button>
          </div>
        </div>
      </section>
      <p class="forget" id="forget-row" hidden><button type="button" class="link" id="forget" data-t="Forget the key">Forget the key</button></p>
      </div>
    </main>

    <dialog id="confirm">
      <form method="dialog">
        <h3 id="confirm-title"></h3>
        <div class="actions">
          <button value="cancel" class="ghost" data-t="Cancel">Cancel</button>
          <button value="remove" class="danger" id="confirm-remove" data-t="Remove">Remove</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
